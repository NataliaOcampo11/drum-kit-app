<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groove Kit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>🥁 Groove Kit</h1>

    <p>Click a button or press a key to create your own beat!</p>

    <div class="drum-kit">

        <button class="drum kick" data-key="a">
            <span class="key">A</span>
            <span>Kick</span>
        </button>

        <button class="drum ride" data-key="s">
            <span class="key">S</span>
            <span>Ride</span>
        </button>

        <button class="drum snare" data-key="d">
            <span class="key">D</span>
            <span>Snare</span>
        </button>

        <button class="drum tom" data-key="f">
            <span class="key">F</span>
            <span>Tom</span>
        </button>

        <button class="drum hihat" data-key="g">
            <span class="key">G</span>
            <span>Hi-Hat</span>
        </button>

    </div>

    <audio id="a" src="sounds/kick.wav"></audio>
    <audio id="s" src="sounds/ride.wav"></audio>
    <audio id="d" src="sounds/snare.wav"></audio>
    <audio id="f" src="sounds/tom.wav"></audio>
    <audio id="g" src="sounds/hihat.wav"></audio>

</body>
</html>
